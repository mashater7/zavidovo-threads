name: Сверка документации Threads
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-docs.mjs
      - run: |
          git config user.name "zavidovo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/docs-hashes.json data/docs-status.json
          git commit -m "Сверка документации" || exit 0
          git pull --rebase && git push
