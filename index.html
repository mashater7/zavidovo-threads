<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Посты Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFEF8;
    --grid: rgba(120, 160, 210, .18);
    --rule: #C7D6EA;
    --margin: #E9A3A3;
    --ink: #24324A;
    --pen: #2B4F9E;
    --red-pen: #C23B3B;
    --muted: #6E7787;
    --fire: #F0952A;
    --cell: 22px;
  }
  * { box-sizing: border-box; }
  button, a, input, textarea { touch-action: manipulation; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font: 15px/1.45 "PT Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    min-height: 100vh;
  }
  .sheet { position: relative; max-width: 980px; margin: 0 auto; padding: 28px 24px 64px 72px; }
  .sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 52px; width: 1.5px; background: var(--margin); }
  h1 { font: 700 44px/1 "Caveat", cursive; color: var(--pen); margin: 0 0 4px; }
  h2 { font: 700 30px/1.1 "Caveat", cursive; color: var(--pen); margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .note { display: inline-block; background: #FFF1DC; padding: 4px 10px; margin: 0 0 18px; transform: rotate(-.4deg); }
  .note.err { background: #FBE3E3; color: var(--red-pen); }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-bottom: 18px; }
  .tab { font: inherit; color: var(--ink); background: none; border: 0; padding: 8px 2px; cursor: pointer; min-height: 44px; }
  .tab span { color: var(--muted); }
  .tab[aria-pressed="true"] { font-weight: 700; background: linear-gradient(transparent 62%, rgba(240,149,42,.45) 62%, rgba(240,149,42,.45) 92%, transparent 92%); }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--fire); outline-offset: 2px; }

  .photos { display: flex; gap: 4px; overflow-x: auto; margin: 6px 0 0; }
  .photos img { width: 56px; height: 56px; object-fit: cover; border-radius: 3px; flex: none; }
  .photos .ph { position: relative; flex: none; width: 64px; height: 64px; }
  .photos .ph img { width: 64px; height: 64px; display: block; }
  .ph-x { position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: flex-start; justify-content: flex-end; }
  .ph-x span { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin: 3px; border-radius: 50%; background: rgba(255,255,255,.95); color: var(--red-pen); font: 700 18px/1 system-ui, sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .ph-x:hover span { background: #fff; color: #B3261E; }
  .ph-back { font-size: 13px; min-height: 44px; }
  .pult-now { margin: -6px 0 14px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 20px; }
  .pult-now::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2F7A45; flex: none; }
  .pult-now.busy { color: var(--pen); font-weight: 700; }
  .pult-now.busy::before { background: var(--fire); animation: pulse 1.4s ease-in-out infinite; }
  .pult-now.off { color: var(--red-pen); }
  .pult-now.off::before { background: var(--red-pen); }
  .pult-now:empty { display: none; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .pult-now.busy::before { animation: none; } }
  .idea-why { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .older-ideas { margin: 20px 0 8px; }
  .older-ideas summary { cursor: pointer; color: var(--pen); min-height: 44px; display: flex; align-items: center; font-weight: 700; }
  .perm-h { margin-top: 28px; }
  .add-ph { display: inline-flex; align-items: center; cursor: pointer; margin-right: 16px; }
  .add-ph:focus-within { outline: 2px solid var(--fire); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; min-height: 44px; padding: 0 4px; }
  .pair { padding: 16px 0 20px; border-bottom: 1px solid var(--rule); }
  .pair-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .pair-head h3 { font: 700 26px/1 "Caveat", cursive; color: var(--pen); margin: 0; }
  .pair-head span { color: var(--muted); font-size: 13px; }
  .label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
  .neg { margin: 0; color: var(--ink); }
  .copy { font: inherit; font-size: 14px; color: var(--pen); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; min-height: 44px; }
  textarea, input[type=url], input[type=password] {
    width: 100%; font: 16px/1.4 "PT Sans", system-ui, sans-serif; color: var(--pen);
    background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px;
  }
  textarea { resize: vertical; min-height: 84px; }
  .count { font-size: 12px; color: var(--muted); text-align: right; margin-top: 2px; }
  .count.over { color: var(--red-pen); font-weight: 700; }
  .check { margin: 8px 0 0; padding: 6px 10px; background: #FFF1DC; font-size: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .row input { flex: 1 1 260px; }
  .ok-btn {
    font: 700 16px/1 "PT Sans", sans-serif; color: #fff; background: var(--pen);
    border: 0; border-radius: 4px; padding: 0 22px; min-height: 44px; cursor: pointer;
  }
  .ok-btn:disabled { background: #9AA6BC; cursor: not-allowed; }
  .verdict { margin: 8px 0 0; font-size: 14px; }
  .verdict.no { color: var(--red-pen); }
  .verdict.yes { color: var(--pen); font-weight: 700; }

  .topic { display: grid; grid-template-columns: minmax(150px, 220px) 1fr 56px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .topic .bar { height: 12px; background: rgba(240,149,42,.55); border-radius: 2px; }
  .topic .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--pen); font-weight: 700; }
  .srcs { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0 0 16px; padding: 0; list-style: none; color: var(--muted); }
  .srcs b { color: var(--pen); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; vertical-align: top; padding: 8px 8px; border-bottom: 1px solid var(--rule); }
  th { font-size: 13px; color: var(--pen); border-bottom: 2px solid var(--pen); }
  td.when { white-space: nowrap; color: var(--muted); width: 1%; }
  .st-ok { color: var(--pen); font-weight: 700; }
  .st-no { color: var(--red-pen); }

  .switch { display: inline-flex; border: 1.5px solid var(--pen); border-radius: 6px; overflow: hidden; margin: 18px 0 6px; max-width: 100%; }
  .switch-btn { font: 700 15px/1 "PT Sans", sans-serif; color: var(--pen); background: #fff; border: 0; padding: 0 16px; min-height: 44px; cursor: pointer; }
  .switch-btn + .switch-btn { border-left: 1.5px solid var(--pen); }
  .switch-btn[aria-pressed="true"] { background: var(--pen); color: #fff; }
  .switch-btn[aria-pressed="true"] .group-n { color: rgba(255,255,255,.8); }
  .group-n { font-weight: 400; color: var(--muted); }
  .toolbar { justify-content: space-between; margin: 0 0 8px; }
  .toolbar .sub, .toolbar h2 { margin: 0; }
  .table-wrap { overflow-x: auto; }
  .table-wrap table { min-width: 760px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; width: 1%; }
  td.num { font-weight: 700; color: var(--pen); }
  .topic-wrap { border-bottom: 1px solid var(--rule); }
  .topic-wrap .topic { border-bottom: 0; cursor: pointer; }
  .topic-wrap summary { list-style: none; }
  .topic-wrap summary::-webkit-details-marker { display: none; }
  .topic-wrap summary .topic > span:first-child::before { content: "▸ "; color: var(--muted); }
  .topic-wrap[open] summary .topic > span:first-child::before { content: "▾ "; }
  .quotes { margin: 0 0 12px; padding: 0 0 0 16px; color: var(--ink); }
  .quotes li { margin: 6px 0; }
  .src { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .acct { margin: 0 0 26px; }
  .acct-h { font: 700 24px/1.1 "Caveat", cursive; color: var(--pen); margin: 18px 0 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 22px; margin: 4px 0 16px; }
  .kpi b { display: block; font: 700 32px/1.05 "Caveat", cursive; color: var(--pen); font-variant-numeric: tabular-nums; }
  .kpi span { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
  .kpi.fire b { color: #C9701A; }
  .demo { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 4px 28px; }
  .demo ol { margin: 0 0 12px; padding: 0; list-style: none; }
  .demo li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
  .demo li b { color: var(--pen); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .acct details { margin-top: 4px; }
  .acct details summary { cursor: pointer; color: var(--pen); min-height: 44px; display: flex; align-items: center; }
  details.settings { margin-top: 36px; color: var(--muted); }
  details.settings summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  details.settings p { margin: 6px 0; font-size: 14px; }

  /* Воронки: одна полоса = один шаг; длина — доля от первого шага, процент — переход между шагами */
  .fn { margin: 4px 0 6px; }
  .fn-row { display: grid; grid-template-columns: 210px 1fr 76px 200px; gap: 6px 14px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .fn-label { color: var(--ink); line-height: 1.25; }
  .fn-label small { display: block; color: var(--muted); font-size: 13px; }
  .fn-track { height: 14px; background: rgba(43,79,158,.07); border-radius: 0 3px 3px 0; }
  .fn-track i { display: block; height: 100%; min-width: 3px; background: var(--pen); border-radius: 0 3px 3px 0; }
  .fn-row.goal .fn-track i { background: var(--fire); }
  .fn-row.goal .fn-label { font-weight: 700; }
  .fn-n { text-align: right; color: var(--pen); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fn-p { color: var(--muted); font-size: 13px; line-height: 1.3; }
  .fn-p b { color: var(--ink); font-size: 15px; }
  .fn-p.drop b { color: #B4600F; }
  .fn-row.nodata .fn-track { background: none; height: 0; border-top: 1px solid var(--rule); }
  .fn-row.nodata .fn-n, .fn-row.nodata .fn-label { color: var(--muted); }
  .fn-note { color: var(--muted); font-size: 13px; margin: 6px 0 14px; }
  .rp-list { margin: 4px 0 0; }
  .rp { display: grid; grid-template-columns: 1fr 380px; gap: 8px 28px; padding: 12px 0 4px; border-bottom: 1px solid var(--rule); }
  .rp-meta { color: var(--muted); font-size: 13px; }
  .rp-meta .best { color: #B4600F; font-weight: 700; }
  .rp-text { margin: 2px 0; }
  .rp-side { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #log .links a { display: inline-flex; align-items: center; min-height: 44px; color: var(--pen); }
  .mf-row { display: grid; grid-template-columns: 88px 1fr 44px 58px 54px; gap: 8px; align-items: center; font-size: 13px; min-height: 24px; }
  .mf-row > span:first-child { color: var(--muted); }
  .mf-row .fn-track { height: 8px; }
  .mf-row b { text-align: right; color: var(--pen); font-variant-numeric: tabular-nums; }
  .mf-row em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mf-row em.drop { color: #B4600F; font-weight: 700; }
  .mf-empty { color: var(--muted); font-size: 13px; padding-top: 4px; }
  /* светофор: точка + слово; оценка Threads «выше / обычный / ниже обычного» или динамика аккаунта */
  .lt { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .lt i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
  .lt-up { color: #2F7A45; }
  .lt-same { color: var(--muted); }
  .lt-down { color: var(--red-pen); }
  .fn-label .lt { display: flex; margin-top: 2px; }
  .mf-lt { min-width: 54px; }
  .more-btn { font: inherit; color: var(--pen); background: none; border: 1.5px solid var(--pen); border-radius: 4px; min-height: 44px; padding: 0 16px; margin-top: 12px; cursor: pointer; }
  #log .switch { margin: 0; }

  @media (max-width: 640px) {
    .sheet { padding: 20px 16px 48px 40px; }
    .sheet::before { left: 26px; }
    h1 { font-size: 36px; }
    .topic { grid-template-columns: 1fr 48px; }
    .topic .bar { grid-column: 1 / -1; grid-row: 2; }
    .ok-btn { width: 100%; }
    /* журнал: строка таблицы → карточка, цифры с подписями под текстом, без прокрутки вбок */
    .kpis { grid-template-columns: 1fr 1fr; }
    /* воронка: подпись и число в строку, полоса и процент под ними */
    .fn-row { grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 0; }
    .fn-row .fn-track { grid-column: 1 / -1; grid-row: 2; }
    .fn-row .fn-p { grid-column: 1 / -1; }
    .rp { grid-template-columns: 1fr; gap: 6px; }
    .mf-row { grid-template-columns: 76px 1fr 36px 50px 50px; gap: 6px; }
    #log .switch { margin: 6px 0; }
  }
</style>
</head>
<body>
<main class="sheet">
  <h1>Посты для Threads</h1>
  <p class="sub">«Ответы» — найденные посты, где ищут дом или рекламируются: ответ с фото уходит по «ОК». «Посты» — негатив постишь сама, позитив уходит по «ОК».</p>
  <p class="note err" id="docs-note" hidden></p>
  <p class="pult-now" id="pult-now" aria-live="polite"></p>

  <nav class="tabs" aria-label="Разделы">
    <button class="tab" data-tab="answers" aria-pressed="true">Ответы <span id="n-answers"></span></button>
    <button class="tab" data-tab="posts" aria-pressed="false">Посты <span id="n-posts"></span></button>
    <button class="tab" data-tab="neg" aria-pressed="false">Негатив <span id="n-neg"></span></button>
    <button class="tab" data-tab="log" aria-pressed="false">Журнал <span id="n-log"></span></button>
  </nav>

  <section id="answers">
    <div class="row toolbar">
      <button class="ok-btn" id="btn-search" type="button">Обновить поиск</button>
      <p class="sub" id="answers-sub"></p>
    </div>
    <div id="answers-list"></div>
  </section>

  <section id="posts" hidden></section>

  <section id="neg" hidden>
    <div class="row toolbar">
      <h2>На что жалуются гости</h2>
      <button class="ok-btn" id="btn-reviews" type="button">Обновить отзывы</button>
    </div>
    <p class="sub" id="reviews-sub"></p>
    <p class="sub" id="neg-sub"></p>
    <ul class="srcs" id="srcs"></ul>
    <div id="topics"></div>
  </section>

  <section id="log" hidden>
    <div class="row toolbar">
      <h2>Отправленные ответы</h2>
      <button class="ok-btn" id="btn-stats" type="button">Обновить цифры</button>
    </div>
    <p class="sub" id="log-sub"></p>
    <div class="acct" id="acct" hidden></div>
    <div class="row toolbar">
      <h3 class="acct-h">Каждый ответ</h3>
      <div class="switch" role="group" aria-label="Порядок ответов" id="rp-sort">
        <button class="switch-btn" type="button" data-sort="new" aria-pressed="true">Сначала новые</button>
        <button class="switch-btn" type="button" data-sort="best" aria-pressed="false">Больше всех привели</button>
      </div>
    </div>
    <div id="rp-total"></div>
    <div class="rp-list" id="log-rows"></div>
  </section>

</main>

<script type="module">
import { check, waitText } from './scripts/rules.js';

const REPO = 'mashater7/zavidovo-threads';
const SRC = { yandex_travel: 'Яндекс Путешествия', yandex_maps: 'Яндекс Карты', '2gis': '2ГИС', otello: 'Otello',
  cian: 'Циан', sutochno: 'Суточно.ру', tvil: 'Твил', avito: 'Авито', otzovik: 'Отзовик', tonkosti: 'Тонкости', irecommend: 'irecommend' };

const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
// Облачный пульт (Timeweb, Амстердам) — работает и с телефона, когда компьютер выключен.
// Ключ попадает в браузер один раз: по ссылке с #k=…, которую прислал Claude; дальше хранится в этом браузере.
const PULT = 'https://72-56-123-163.sslip.io';
{ const m = /[#&]k=([\w-]+)/.exec(location.hash); if (m) { store.set('pult-key', m[1]); history.replaceState(null, '', location.pathname + location.search); } }
const pultFetch = (path, opt = {}) => fetch(PULT + path, { ...opt, cache: 'no-store', headers: { ...(opt.headers || {}), 'X-Pult-Key': store.get('pult-key') } });
// Данные — только от пульта, с тремя попытками. Копию с GitHub берём лишь для неизменных файлов (правила, пары, темы):
// 26.10 сайт при секундном сбое молча показывал застывшую копию от 25.10 — с уже отвеченными и пропущенными постами
const LIVE = ['data/answers.json', 'data/log.json', 'data/account.json'];
let dataStale = false;
async function json(f) {
  for (let i = 0; i < 3; i++) {
    try { const r = await pultFetch('/api/' + f); if (r.ok) return await r.json(); } catch {}
    await new Promise(res => setTimeout(res, 1500));
  }
  if (LIVE.includes(f)) { dataStale = true; throw new Error('пульт не ответил'); }
  return (await fetch(f + '?t=' + Date.now())).json();
}

let rules, docs, log = [], topics, account;

const freshLog = () => json('data/log.json');

// Числа и проценты по-русски: «8 534», «4,3 %». Нет данных — «—», а не 0.
const num = v => (typeof v === 'number' ? v.toLocaleString('ru-RU') : '—');
const isNum = v => typeof v === 'number' && isFinite(v);
const pct = (a, b) => {
  if (!isNum(a) || !isNum(b) || b <= 0) return '—';
  const x = a / b * 100;
  return x.toLocaleString('ru-RU', { maximumFractionDigits: x > 0 && x < 1 ? 2 : 1 }) + ' %';
};
// Воронка: строки {label, sub, value, pb (жирный процент), p (подпись), goal, nodata, drop}; длина полосы — доля от первого шага
// Светофор: точка + слово (цвет не единственный признак). kind: up / same / down
function light(kind, word) {
  if (!kind) return '';
  const s = el('span', 'lt lt-' + kind); s.append(el('i'), word || { up: 'выше обычного', same: 'как обычно', down: 'ниже обычного' }[kind]);
  return s;
}
// Динамика аккаунта к прошлым 30 дням (так её показывает Threads) → светофор
function trend(ch) {
  if (!isNum(ch)) return '';
  if (ch === 0) return light('same', 'без изменений');
  const t = Math.abs(ch) >= 1000 ? `в ${Math.round(ch / 100 + 1).toLocaleString('ru-RU')} раз` : (ch > 0 ? '+' : '−') + String(Math.abs(ch)).replace('.', ',') + ' %';
  return light(ch > 0 ? 'up' : 'down', (ch > 0 ? 'растёт ' : 'падает ') + t);
}

function funnel(rows, top) {
  const box = el('div', 'fn');
  for (const r of rows) {
    const row = el('div', 'fn-row' + (r.goal ? ' goal' : '') + (r.nodata ? ' nodata' : ''));
    const lab = el('div', 'fn-label', r.label); if (r.sub) lab.append(el('small', null, r.sub)); if (r.light) lab.append(r.light);
    const tr = el('div', 'fn-track');
    if (!r.nodata && isNum(r.value) && isNum(top) && top > 0) {
      const i = el('i'); i.style.width = Math.max(0, Math.min(100, r.value / top * 100)) + '%';
      tr.title = r.label + ': ' + num(r.value) + (r.pb ? ' · ' + r.pb + ' ' + (r.p || '') : ''); tr.append(i);
    }
    const p = el('div', 'fn-p' + (r.drop ? ' drop' : ''));
    if (r.pb) p.append(el('b', null, r.pb), ' ' + (r.p || '')); else p.textContent = r.p || '';
    row.append(lab, tr, el('b', 'fn-n', r.nodata ? '—' : num(r.value)), p);
    box.append(row);
  }
  return box;
}

// Каждый ответ: мини-воронка «увидели → в профиль → подписались»; процент — переход с прошлого шага
let rpSort = 'new', rpAll = false, rpSent = [];
const RP_SHOW = 7;
function renderReplies(sent) {
  rpSent = sent;
  const tb = $('log-rows'); tb.textContent = '';
  const total = $('rp-total'); total.textContent = '';
  $('rp-sort').hidden = sent.length < 2;
  if (!sent.length) { tb.append(el('p', 'sub', 'Пока ничего не отправляли.')); return; }
  const st = e => e.stats || {};
  const reach = s => (isNum(s.viewers) ? s.viewers : s.views);
  // Сумма по всем ответам — только там, где цифры есть
  const sum = k => sent.reduce((t, e) => t + (isNum(st(e)[k]) ? st(e)[k] : 0), 0);
  const withStats = sent.filter(e => isNum(st(e).viewers)).length;
  if (withStats) {
    const V = sum('viewers'), P = sum('profile_visits'), F = sum('follows');
    const pP = V > 0 ? P / V : 0, pF = P > 0 ? F / P : 0;
    total.append(el('span', 'label', `Все ответы вместе · ${withStats} с цифрами`), funnel([
      { label: 'Увидели ответы', sub: num(sum('views')) + ' просмотров', value: V },
      { label: 'Зашли в профиль', value: P, pb: pct(P, V), p: 'от увидевших', drop: pP <= pF },
      { label: 'Подписались', value: F, goal: true, pb: pct(F, P), p: 'от зашедших в профиль', drop: pF < pP },
    ], V), el('p', 'fn-note', 'Клик «Забронировать домик» Threads считает только по профилю целиком — он в воронке аккаунта выше. Процент в строке ответа — сколько перешли с прошлого шага.'));
  }
  const best = sent.length > 1 ? sent.reduce((b, e) => ((st(e).profile_visits || 0) > (st(b).profile_visits || 0) ? e : b), sent[0]) : null;
  const bestId = best && (st(best).profile_visits || 0) > 0 ? best.id : null;
  const list = sent.slice();
  if (rpSort === 'best') list.sort((x, y) => (st(y).profile_visits || 0) - (st(x).profile_visits || 0) || (reach(st(y)) || 0) - (reach(st(x)) || 0));
  else list.sort((x, y) => String(y.sent_at || '').localeCompare(String(x.sent_at || '')));
  const shown = rpAll ? list : list.slice(0, RP_SHOW);
  for (const e of shown) {
    const s = st(e), card = el('article', 'rp');
    const left = el('div');
    const meta = el('div', 'rp-meta', (e.sent_at ? new Date(e.sent_at).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—') + (e.author ? ' · ' + e.author : ''));
    if (e.id === bestId) meta.append(' · ', el('span', 'best', 'больше всех привёл в профиль'));
    left.append(meta, el('p', 'rp-text', e.reply_text || ''));
    const vd = s.verdicts || {};
    const side = el('div', 'rp-side');
    for (const [k, l] of [['views', 'просмотров'], ['likes', 'лайков'], ['replies', 'ответов'], ['reposts', 'репостов']]) {
      if (!(k in s)) continue;
      if (side.childNodes.length) side.append(' · ');
      side.append(l + ' ' + num(s[k]) + ' ');
      if (k !== 'reposts' || vd[k] !== 'same') side.append(light(vd[k]));   // репосты почти всегда 0 «как обычно» — не шумим
    }
    if (side.childNodes.length) left.append(side);
    if ((s.sources || []).length) left.append(el('div', 'rp-side', 'Откуда: ' + s.sources.map(x => x.name + ' ' + String(x.pct).replace('.', ',') + ' %').join(', ')));
    const links = el('div', 'links');
    if (e.post_url) { const a = el('a', null, 'их пост'); a.href = e.post_url; a.target = '_blank'; a.rel = 'noopener'; links.append(a); }
    if (e.post_url && e.reply_url) links.append(' · ');
    if (e.reply_url) { const a = el('a', null, 'наш ответ'); a.href = e.reply_url; a.target = '_blank'; a.rel = 'noopener'; links.append(a); }
    left.append(links);
    const right = el('div');
    const top = reach(s);
    if (!isNum(top)) right.append(el('div', 'mf-empty', 'Цифр пока нет — появятся после обновления.'));
    else if (top === 0) right.append(el('div', 'mf-empty', 'Пока 0 просмотров.'));
    else {
      const pP = isNum(s.profile_visits) ? s.profile_visits / top : null;
      const pF = isNum(s.follows) && s.profile_visits > 0 ? s.follows / s.profile_visits : null;
      const low = pP != null && pF != null ? (pP <= pF ? 'p' : 'f') : null;
      const mrow = (label, v, p, fire, isLow, kind) => {
        const r = el('div', 'mf-row'), tr = el('div', 'fn-track');
        if (isNum(v)) { const i = el('i'); i.style.width = Math.min(100, v / top * 100) + '%'; if (fire) i.style.background = 'var(--fire)'; tr.append(i); }
        tr.title = label + ': ' + num(v) + (p ? ' · ' + p : '');
        const lt = el('span', 'mf-lt'); if (kind) lt.append(light(kind, { up: 'выше', same: 'норма', down: 'ниже' }[kind]));
        r.append(el('span', null, label), tr, el('b', null, num(v)), el('em', isLow ? 'drop' : '', p || ''), lt);
        return r;
      };
      right.append(
        mrow(isNum(s.viewers) ? 'увидели' : 'просмотры', top, '', false, false, vd.viewers || vd.views),
        // у свежего ответа Threads обновляет зрителей и заходы в профиль с разной скоростью — процент > 100 не показываем
        mrow('в профиль', s.profile_visits, isNum(s.profile_visits) && s.profile_visits <= top ? pct(s.profile_visits, top) : '', false, low === 'p', vd.profile_visits),
        mrow('подписались', s.follows, isNum(s.follows) ? (s.profile_visits > 0 ? pct(s.follows, s.profile_visits) : '—') : '', true, low === 'f', vd.follows));
    }
    card.append(left, right);
    tb.append(card);
  }
  if (!rpAll && list.length > RP_SHOW) {
    const more = el('button', 'more-btn', `Показать все (${list.length})`); more.type = 'button';
    more.onclick = () => { rpAll = true; renderReplies(rpSent); };
    tb.append(more);
  }
}

  const lblU = el('label', 'label', 'Ссылка на твой пост с негативом'); lblU.htmlFor = 'url-' + p.id;
  box.append(lblU);
  const row = el('div', 'row');
  const url = el('input'); url.id = 'url-' + p.id; url.type = 'url'; url.placeholder = 'threads.com/@ник/post/…'; url.value = store.get('url-' + p.id);
  const ok = el('button', 'ok-btn', 'ОК'); ok.type = 'button';
  row.append(url, ok);
  const verdict = el('p', 'verdict'); verdict.setAttribute('aria-live', 'polite');
  box.append(row, verdict);

  const sentHere = () => log.find(e => e.ok && e.id === p.id);
  function refresh() {
    ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px';
    store.set('pos-' + p.id, ta.value); store.set('url-' + p.id, url.value.trim());
    const n = ta.value.trim().length;
    cnt.textContent = n + ' / ' + rules.api.maxTextLength; cnt.className = 'count' + (n > rules.api.maxTextLength ? ' over' : '');
    const done = sentHere();
    if (done) { verdict.className = 'verdict yes'; verdict.textContent = 'Опубликовано ' + new Date(done.at).toLocaleString('ru-RU'); ok.disabled = true; return; }
    if (!url.value.trim()) { verdict.className = 'verdict'; verdict.textContent = ''; ok.disabled = true; return; }
    const v = check({ text: ta.value, replyUrl: url.value.trim(), rules, log, docs });
    verdict.className = 'verdict' + (v.ok ? '' : ' no');
    verdict.textContent = v.ok ? 'Правила и частота в порядке — можно отправлять.' : v.reason + ' ' + waitText(v.waitMinutes);
    ok.disabled = !v.ok;
  }
  ta.oninput = refresh; url.oninput = refresh;
  ok.onclick = () => send(p, ta.value.trim(), url.value.trim(), ok, verdict, refresh);
  refresh();
  box.refresh = refresh;
  return box;
}

async function send(p, text, replyUrl, btn, verdict, refresh, photos = 0, uploads = []) {
  // photos — число или массив номеров оставленных фото ([1,2,5]); uploads — имена своих фото на пульте
  const payload = Array.isArray(photos)
    ? { id: p.id, text, reply_url: replyUrl, photos: photos.length + uploads.length, photos_list: photos.slice(), uploads }
    : { id: p.id, text, reply_url: replyUrl, photos, uploads };
  // «ОК» уходит в облачный пульт — с компьютера и с телефона одинаково
  btn.disabled = true; verdict.className = 'verdict'; verdict.textContent = 'Отправляю в Threads…';
  // пока пульт работает, показываем, на каком он шаге
  const tick = setInterval(async () => {
    try {
      const st = await (await pultFetch('/api/status')).json();
      if (st.send && st.send.id === p.id) verdict.textContent = 'Отправляю: ' + st.send.step + '…';
      else if (st.busy && st.threadsTab) verdict.textContent = 'Пульт сейчас ' + st.task + ' — отправлю в ближайшей паузе, это несколько секунд…';
      else if (st.send) verdict.textContent = 'Сначала уходит предыдущий ответ, этот следом…';
    } catch {}
  }, 700);
  try {
    const r = await pultFetch('/api/ok', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).finally(() => clearInterval(tick));
    const j = await r.json();
    const msg = j.message || j.error || 'Пульт не ответил';
    const sent = /^Опубликовано/.test(msg);
    if (sent) log.unshift({ id: p.id, text, replyUrl, ok: true, at: new Date().toISOString() });
    renderLog();
    // сначала обновляем остальные карточки, потом пишем ответ пульта: раньше refresh() тут же затирал его
    // («Не отправлено…», «БЕЗ фото ⚠️» исчезали, оставалось «Правила в порядке») — 26.10 нашла проверка в Safari
    document.querySelectorAll('.pair').forEach(b => b.refresh && b.refresh());
    verdict.className = 'verdict ' + (sent && !/БЕЗ фото/.test(msg) ? 'yes' : 'no'); verdict.textContent = msg;
    btn.disabled = sent;
  } catch {
    clearInterval(tick);
    verdict.className = 'verdict no'; verdict.textContent = 'Облачный пульт не ответил — ничего не отправлено. Проверь интернет и нажми ещё раз через минуту.';
    btn.disabled = false;
  }
}

  const tile = (src, alt, onRemove) => {
    const wrap = el('div', 'ph');
    const img = el('img'); img.src = src; img.alt = alt; img.loading = 'lazy'; img.width = 64; img.height = 64;
    const x = el('button', 'ph-x'); x.type = 'button'; x.setAttribute('aria-label', 'Убрать: ' + alt); x.append(el('span', null, '×'));
    x.onclick = onRemove; wrap.append(img, x); return wrap;
  };
  const drawPhotos = () => {
    ph.textContent = '';
    for (const i of kept) ph.append(tile('photos/' + String(i).padStart(2, '0') + '.jpg', 'Фото ' + i, () => { kept = kept.filter(n => n !== i); save(); }));
    for (const f of added) ph.append(tile(PULT + '/api/photo/' + f + '?k=' + encodeURIComponent(store.get('pult-key')), 'Своё фото', () => { added = added.filter(x => x !== f); save(); }));
    ph.hidden = !total();
    back.hidden = kept.length === all.length;
    addPh.hidden = total() >= MAX_PHOTOS;
    okLabel();
  };
  const save = () => { store.set('ph-' + e.id, kept.length === all.length ? '' : JSON.stringify(kept)); store.set('up-' + e.id, added.length ? JSON.stringify(added) : ''); drawPhotos(); };
  back.onclick = () => { kept = all; save(); };
  inp.onchange = async () => {
    const files = [...inp.files].slice(0, MAX_PHOTOS - total()); inp.value = '';
    for (const [k, f] of files.entries()) {
      phNote.className = 'verdict'; phNote.textContent = `Загружаю фото ${k + 1} из ${files.length}…`;
      try {
        const r = await pultFetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: await shrinkPhoto(f) }) });
        const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
        added.push(j.file); save();
      } catch (err) { phNote.className = 'verdict no'; phNote.textContent = 'Фото не загрузилось: ' + (err.message || err); return; }
    }
    phNote.textContent = '';
  };
  drawPhotos();
  box.append(ph, back, addPh, phNote);
  const row = el('div', 'row');
  const skip = el('button', 'skip', 'Пропустить'); skip.type = 'button';
  row.append(ok, skip);
  const verdict = el('p', 'verdict'); verdict.setAttribute('aria-live', 'polite');
  box.append(row, verdict);

  function refresh() {
    ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px';
    store.set('ans-' + e.id, ta.value);
    const n = ta.value.trim().length;
    cnt.textContent = n + ' / ' + rules.api.maxTextLength; cnt.className = 'count' + (n > rules.api.maxTextLength ? ' over' : '');
    const done = log.find(x => x.ok && x.id === e.id);
    if (done) { verdict.className = 'verdict yes'; verdict.textContent = 'Отвечено ' + new Date(done.at).toLocaleString('ru-RU'); ok.disabled = true; skip.hidden = true; return; }
    const v = check({ text: ta.value, replyUrl: e.post_url, rules, log, docs });
    verdict.className = 'verdict' + (v.ok ? '' : ' no');
    verdict.textContent = v.ok ? 'Правила и частота в порядке — можно отправлять.' : v.reason + ' ' + waitText(v.waitMinutes);
    ok.disabled = !v.ok;
  }
  ta.oninput = refresh;
  ok.onclick = () => send(e, ta.value.trim(), e.post_url, ok, verdict, refresh, kept.slice(), added.slice());
  // пропуск — на сервер, чтобы пост пропал и на телефоне (раньше помнил только этот браузер)
  skip.onclick = () => { store.set('skip-' + e.id, '1'); box.remove(); countAnswers(); skipOnPult(e.id); };
  box.refresh = refresh;
  return box;
}

const skipOnPult = id => {
  // пост убираем из списка в памяти страницы: раньше после ответа сервера стиралась только пометка,
  // и при переключении «Целевые / Самореклама» пропущенные посты возвращались (26.10, воспроизведено в Safari)
  answers.entries = answers.entries.filter(x => x.id !== id);
  return pultFetch('/api/skip', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) })
    .then(r => { if (r.ok) store.set('skip-' + id, ''); }).catch(() => {});   // не вышло — пометка останется и уйдёт при следующем открытии
};

const MAX_PHOTOS = 20;   // столько вложений Threads принимает в одном посте
// Фото с телефона весит 3–8 МБ: уменьшаем до 1440 px по длинной стороне (столько показывает Threads) и сжимаем в JPEG
async function shrinkPhoto(file) {
  // через <img>: работает и в Safari на iPhone (createImageBitmap с настройками там падал); поворот по EXIF браузер учитывает сам
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => fail(new Error('телефон не смог открыть это фото')); i.src = url; });
    const k = Math.min(1, 1440 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}

function countAnswers() { $('n-answers').textContent = answers.entries.filter(e => !store.get('skip-' + e.id)).length || ''; }

function renderAnswers() {
  const list = $('answers-list'); list.textContent = '';
  const fresh = answers.entries.filter(e => !store.get('skip-' + e.id));
  const groups = [
    ['request', 'Целевые запросы', 'ищут дом, баню, куда поехать за город'],
    ['self_promo', 'Самореклама', 'ветки, где можно рассказать о себе'],
  ];
  // Переключатель: показываем одну группу, выбор запоминаем
  const current = store.get('group') || 'request';
  const sw = el('div', 'switch'); sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Какие посты показать');
  list.append(sw);
  for (const [kind, title, hint] of groups) {
    const items = fresh.filter(e => (e.kind === 'self_promo') === (kind === 'self_promo'));
    const b = el('button', 'switch-btn', title + ' '); b.type = 'button';
    b.append(el('span', 'group-n', String(items.length)));
    b.setAttribute('aria-pressed', String(kind === current));
    b.onclick = () => { store.set('group', kind); renderAnswers(); };
    sw.append(b);
    if (kind !== current) continue;
    list.append(el('p', 'sub', items.length ? hint : hint + ' — пока ничего нового. Нажми «Обновить поиск».'));
    items.forEach(e => { const box = renderAnswer(e); list.append(box); box.refresh(); });
  }
  $('answers-sub').textContent = fresh.length
    ? `Найдено постов: ${fresh.length}. Поиск обновлён ${new Date(answers.updated).toLocaleString('ru-RU')}.`
    : 'Новых постов пока нет. Поиск идёт сам каждый день в 10:00 или по кнопке.';
  countAnswers();
}

// Кнопки «Обновить поиск» и «Обновить цифры» работают через пульт на этом компьютере
async function runPult(path, btn, note) {
  btn.disabled = true;
  try {
    const r = await pultFetch(path, { method: 'POST' });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'Пульт ответил ' + r.status); }
    const started = await r.json().catch(() => ({}));
    note.textContent = started.position ? `Пульт занят — встала в очередь (${started.position}-я), начну сама…` : 'Запустила…';
    for (;;) {
      await new Promise(res => setTimeout(res, 3000));
      const st = await (await pultFetch('/api/status')).json();
      if (!st.busy) { if (st.last && !st.last.ok) throw new Error(st.last.error); break; }
      note.textContent = (st.task || 'работаю') + (st.progress ? ': ' + st.progress : '') + '…';
    }
    answers = await json('data/answers.json');
    account = await json('data/account.json').catch(() => account);
    renderAnswers(); renderLog();
  } catch (e) {
    note.textContent = /fetch/i.test(String(e))
      ? 'Облачный пульт не ответил. Проверь интернет и нажми ещё раз через минуту.'
      : 'Не получилось: ' + e.message;
  } finally { btn.disabled = false; }
}
// Строка «Пульт сейчас…» на всех вкладках: видно и то, что запущено по расписанию или с другого устройства
const TASK = { 'поиск': 'ищу новые посты', 'ищу посты': 'ищу новые посты', 'аналитика': 'обновляю цифры', 'собираю цифры': 'обновляю цифры',
  'отзывы': 'проверяю отзывы', 'обновляю отзывы': 'проверяю отзывы', 'отправка': 'отправляю ответ' };
async function pultNow() {
  const box = $('pult-now');
  try {
    const st = await (await pultFetch('/api/status')).json();
    const parts = [];
    if (st.send) parts.push('отправляю ответ — ' + st.send.step);
    if (st.busy && (st.task || !(st.waiting && st.waiting.length))) parts.push((TASK[st.task] || st.task || 'работаю') + (st.progress ? ' — ' + st.progress : ''));
    if (st.waiting && st.waiting.length) parts.push('дальше: ' + st.waiting.map(t => TASK[t] || t).join(', '));
    box.className = 'pult-now' + (parts.length ? ' busy' : '');
    box.textContent = parts.length ? 'Пульт сейчас: ' + parts.join('; ') + '…' : 'Пульт свободен';
  } catch { box.className = 'pult-now off'; box.textContent = 'Пульт не отвечает — проверь интернет'; }
}

function initPult() {
  pultNow(); setInterval(pultNow, 5000);
  $('btn-search').onclick = () => runPult('/api/search', $('btn-search'), $('answers-sub'));
  $('btn-stats').onclick = () => runPult('/api/stats', $('btn-stats'), $('log-sub'));
  $('btn-reviews').onclick = runReviews;
}

// «Обновить отзывы»: пульт обходит Яндекс Карты (до 60 мест), не чаще раза в 3 дня
function reviewsNote() {
  const d = topics.reviews_checked;
  if (!d) return 'Новые отзывы с Яндекс Карт можно подтянуть кнопкой — раз в 3 дня.';
  const next = new Date(new Date(d).getTime() + 3 * 864e5);
  const ru = x => x.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  return `Отзывы обновляли ${ru(new Date(d))}. Следующий раз — с ${ru(next)}.`;
}
async function runReviews() {
  const btn = $('btn-reviews'), note = $('reviews-sub');
  btn.disabled = true;
  try {
    const r = await pultFetch('/api/reviews', { method: 'POST' });
    if (!r.ok) { const j = await r.json().catch(() => ({})); note.textContent = j.error || 'Пульт ответил ' + r.status; return; }
    note.textContent = 'Запустила…';
    let st;
    for (;;) {
      await new Promise(res => setTimeout(res, 3000));
      st = await (await pultFetch('/api/status')).json();
      if (!st.busy) { if (st.last && !st.last.ok) throw new Error(st.last.error); break; }
      note.textContent = (st.task || 'работаю') + (st.progress ? ': ' + st.progress : '') + '…';
    }
    topics = await json('data/topics.json');
    renderTopics();
    const res = (st.last && st.last.result) || {};
    note.textContent = `Готово: проверила ${res.checked ?? '—'} мест, новых отзывов ${res.added ?? 0}. ` + reviewsNote();
  } catch (e) {
    note.textContent = /fetch/i.test(String(e))
      ? 'Облачный пульт не ответил. Проверь интернет и нажми ещё раз через минуту.'
      : 'Не получилось: ' + e.message;
  } finally { btn.disabled = false; }
}

function renderTopics() {
  $('n-neg').textContent = topics.total.toLocaleString('ru-RU');
  $('neg-sub').textContent = `${topics.total.toLocaleString('ru-RU')} отзывов на 1–3★ о ${topics.objects} местах по всей России. Обновлено ${topics.built}.`;
  if (!$('reviews-sub').textContent) $('reviews-sub').textContent = reviewsNote();
  const s = $('srcs'); s.replaceChildren(); $('topics').replaceChildren();
  for (const [k, n] of Object.entries(topics.sources)) { const li = el('li'); li.append(el('b', null, n.toLocaleString('ru-RU')), ' ' + (SRC[k] || k)); s.append(li); }
  const max = Math.max(...topics.topics.map(t => t.count)), box = $('topics');
  for (const t of topics.topics) {
    const wrap = el('details', 'topic-wrap');
    const sum = el('summary');
    const row = el('div', 'topic');
    row.append(el('span', null, t.name));
    const bar = el('div', 'bar'); bar.style.width = (t.count / max * 100) + '%'; row.append(bar);
    row.append(el('span', 'n', t.count.toLocaleString('ru-RU')));
    sum.append(row); wrap.append(sum);
    const ul = el('ul', 'quotes');
    for (const q of t.examples || []) ul.append(el('li', null, q));
    wrap.append(ul);
    box.append(wrap);
  }
}

function initTabs() {
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    for (const id of ['answers', 'posts', 'neg', 'log']) $(id).hidden = id !== b.dataset.tab;
    store.set('tab', b.dataset.tab);
  });
  const saved = store.get('tab'); if (saved) { const b = document.querySelector(`.tab[data-tab="${saved}"]`); if (b) b.click(); }
}


let answers, ideas = { days: [] };
const [pairs] = await Promise.all([
  json('data/pairs.json'),
  // идеи пишет облачная задача Claude прямо в GitHub каждое утро — берём файл с сайта, а не у пульта
  fetch('data/ideas.json?t=' + Date.now()).then(r => r.json()).then(x => ideas = x).catch(() => {}),
  json('data/answers.json').catch(() => ({ entries: [], sent: [] })).then(x => answers = x),
  json('data/rules.json').then(x => rules = x),
  json('data/docs-status.json').then(x => docs = x),
  json('data/topics.json').then(x => topics = x),
  json('data/account.json').then(x => account = x).catch(() => {}),
]);
log = await freshLog().catch(() => []);
if (dataStale) { const n = $('docs-note'); n.hidden = false; n.textContent = 'Не удалось загрузить посты с сервера — обнови страницу через минуту. Старые данные не показываю, чтобы не было уже отвеченных постов.'; }
if (docs.changed) { const n = $('docs-note'); n.hidden = false; n.textContent = 'Документация Threads изменилась ' + (docs.since || '') + '. Публикация на паузе, пока правила не сверят.'; }
const today = (ideas.days || [])[0];
$('n-posts').textContent = (today ? today.pairs.length + today.posts.length : 0) || pairs.length;
renderIdeas();
const weight = p => p.topic === 'другое' ? -1 : (topics.topics.find(t => t.key === p.topic) || { count: 0 }).count;
pairs.sort((a, b) => weight(b) - weight(a)).forEach(p => { const box = renderPair(p); $('posts').append(box); box.refresh(); });
// пропуски, нажатые раньше только в этом браузере, отправляем на сервер — тогда они пропадут и на телефоне
for (const e of answers.entries) if (store.get("skip-" + e.id)) skipOnPult(e.id);
renderAnswers();
initPult();
renderTopics(); renderLog(); initTabs();
</script>
